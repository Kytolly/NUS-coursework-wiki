site_name: "NUS Coursework Wiki"
site_description: "NUS Computer Engineering coursework records and deliverables"
site_author: "Kytolly"
site_url: "https://kytolly.github.io/NUS-coursework-wiki/"
repo_url: "https://github.com/Kytolly/NUS-coursework-wiki"
repo_name: "Kytolly/NUS-coursework-wiki"
docs_dir: ../build/preview/docs
site_dir: ../build/preview/site
use_directory_urls: false

theme:
  name: material
  language: zh
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/vendor/mermaid-11.17.2.min.js
  - javascripts/mermaid.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

